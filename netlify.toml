# Netlify static hosting for SIDEBURNS (installable PWA — not a native store app).
# Do not deploy until explicitly authorized. See docs/deployment.md.

[build]
  command = "npm run build"
  publish = "dist"

# Node version for Netlify's build image (keep in sync with .nvmrc / package.json engines).
[build.environment]
  NODE_VERSION = "20"

# SPA deep-link fallback: unknown paths serve index.html (200) so React Router works
# on first load before the service worker navigateFallback controls navigations.
# Existing files under /maps, /packs, /assets, etc. are still served as static assets
# (Netlify only applies this when the path is not a real file).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"
