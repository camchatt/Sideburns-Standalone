# SIDEBURNS local Supabase CLI configuration.
# This project is independent of Artelier. Do not link Artelier project refs,
# credentials, buckets, or schemas here.
#
# Remote `db push` / migration apply requires explicit human approval.
# See docs/supabase-backend.md.

project_id = "mxqrchnkjxgmdvswbptz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080", "http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
enable_magic_link = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = false
